services:
  postgres:
    image: postgres:16
    pull_policy: never
    container_name: prj649_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prj649}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prj649_dev}
      POSTGRES_DB: ${POSTGRES_DB:-academic_analytics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prj649}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
