[project]
name = "prj649-ml"
version = "0.1.0"
description = "ML development for PRJ_649 Academic Analytics"
readme = "README.md"
authors = [
    { name = "kishore-sv", email = "kishorbunni7@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
