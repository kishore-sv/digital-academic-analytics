[project]
name = "prj649-ml"
version = "0.1.0"
description = "ML development for PRJ_649 Academic Analytics"
readme = "README.md"
authors = [
    { name = "kishore-sv", email = "kishorbunni7@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "joblib>=1.4.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn==1.6.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
