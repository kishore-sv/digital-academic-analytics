[project]
name = "prj649-backend"
version = "0.1.0"
description = "FastAPI backend for PRJ_649 Academic Analytics"
readme = "README.md"
authors = [
    { name = "kishore-sv", email = "kishorbunni7@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "psycopg>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
